name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview = debug APK, development = dev client APK)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: datung-app/package-lock.json

      - name: Install dependencies
        working-directory: datung-app
        run: npm ci --legacy-peer-deps

      - name: Set up EAS CLI
        run: npm install -g eas-cli

      - name: Build APK via EAS
        id: eas_build
        working-directory: datung-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --platform android \
            --non-interactive \
            --wait \
            --json 2>/dev/null | tee /tmp/eas-output.json || true
          BUILD_URL=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/eas-output.json'))
              if isinstance(data, list): data = data[0]
              print(data.get('artifacts', {}).get('buildUrl', '') or data.get('buildUrl', ''))
          except: pass
          ")
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "APK download URL: $BUILD_URL"

      - name: Download APK
        if: steps.eas_build.outputs.build_url != ''
        run: |
          mkdir -p datung-app/build
          curl -L "${{ steps.eas_build.outputs.build_url }}" -o datung-app/build/app.apk
          echo "APK size: $(du -h datung-app/build/app.apk | cut -f1)"

      - name: Upload APK as artifact
        if: steps.eas_build.outputs.build_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: datung-app-${{ github.event.inputs.profile || 'preview' }}-${{ github.run_number }}
          path: datung-app/build/app.apk
          retention-days: 30
